# Include inside the OpenGreenCompute HTTPS server block.
# Commons entry points serve the existing static Commons page.
location = /greendigit-commons {
    root /home/goncalo/GRISSA/static;
    try_files /commons.html =404;
}

location = /greendigit-commons/ {
    root /home/goncalo/GRISSA/static;
    try_files /commons.html =404;
}

location = /gd-commons {
    root /home/goncalo/GRISSA/static;
    try_files /commons.html =404;
}

location = /gd-commons/ {
    root /home/goncalo/GRISSA/static;
    try_files /commons.html =404;
}

# Next.js is built with NEXT_PUBLIC_BASE_PATH=/gd-commons/grissa.
location = /gd-commons/grissa {
    return 302 /gd-commons/grissa/saq$is_args$args;
}

location = /gd-commons/grissa/ {
    return 302 /gd-commons/grissa/saq$is_args$args;
}

location ^~ /gd-commons/grissa/ {
    # Preserve the full path, including the build-time basePath.
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        "upgrade";
}

# Keep existing bookmarks, including deeper routes and query parameters.
location = /grissa {
    return 308 /gd-commons/grissa/saq$is_args$args;
}

location = /grissa/ {
    return 308 /gd-commons/grissa/saq$is_args$args;
}

location ^~ /grissa/ {
    rewrite ^/grissa/(.*)$ /gd-commons/grissa/$1 permanent;
}
